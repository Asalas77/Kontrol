# Blueprint de Render para desplegar Kontrol gratis, solo para pruebas.
# En render.com: New -> Blueprint -> selecciona este repo -> Render lee este archivo
# y crea los servicios automáticamente (base de datos, api, web y landing).
#
# Notas sobre el free tier de Render:
# - Web Service (api): "duerme" tras ~15 min sin tráfico; la siguiente petición tarda
#   unos segundos en despertarlo. Normal y gratis siempre.
# - Static Site (web): nunca duerme, siempre gratis, con HTTPS y dominio *.onrender.com.
# - Base de datos: Render solo permite una PostgreSQL gratis por cuenta. Si la cuenta que
#   despliega este blueprint ya tiene otra base gratis, hay que borrar el bloque
#   `databases` de abajo y volver a apuntar DB_HOST/DB_USER/DB_PASSWORD/DB_NAME a un
#   Postgres externo (Neon, etc.) con sync:false, como se hacía antes.

databases:
  - name: kontrol-db
    plan: free
    region: oregon

services:
  - type: web
    name: kontrol-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: kontrol-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kontrol-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: kontrol-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kontrol-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: kontrol-db
          property: database
      - key: DB_SSL
        value: 'false'
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: NODE_ENV
        value: production
      - key: COOKIE_CROSS_SITE
        value: 'true'
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # URL pública de esta misma API — la usa el login social (SSO) para armar el
      # redirect_uri que se registra en Google/Microsoft. Sin GOOGLE_CLIENT_ID/SECRET ni
      # MICROSOFT_CLIENT_ID/SECRET, los botones de SSO devuelven un error claro en vez de
      # romper el arranque (ver OidcSsoProvider).
      - key: API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Correo de aviso al recibir un comentario en "Soporte y comentarios". Sin
      # SMTP_HOST el comentario igual se guarda, solo no se envía el correo (ver
      # SmtpEmailNotifier). SMTP_USER/SMTP_PASS se completan a mano en el dashboard.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: 'Kontrol <kontrolcalidadasalas@gmail.com>'
      - key: SUPPORT_EMAIL_TO
        value: kontrolcalidadasalas@gmail.com

  - type: web
    name: kontrol-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      # Muestra un botón "Ver demo" en el login que entra con un clic a una cuenta de
      # demostración — sin estas dos variables el botón simplemente no aparece (ver
      # LoginPage.tsx). No son credenciales de un usuario real, son públicas a propósito.
      - key: VITE_DEMO_EMAIL
        sync: false
      - key: VITE_DEMO_PASSWORD
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kontrol-landing
    runtime: static
    staticPublishPath: landing
