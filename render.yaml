# Blueprint de Render para desplegar Kontrol gratis, solo para pruebas.
# En render.com: New -> Blueprint -> selecciona este repo -> Render lee este archivo
# y crea los servicios automáticamente (api, web y landing).
#
# Notas sobre el free tier de Render:
# - Web Service (api): "duerme" tras ~15 min sin tráfico; la siguiente petición tarda
#   unos segundos en despertarlo. Normal y gratis siempre.
# - Static Site (web): nunca duerme, siempre gratis, con HTTPS y dominio *.onrender.com.
# - Base de datos: Render solo permite una PostgreSQL gratis por cuenta, y esta cuenta ya
#   tiene otro proyecto usándola. Por eso la base va en Neon (neon.tech) — Postgres
#   gratuito externo, sin límite de tiempo, sin chocar con el cupo de Render.

services:
  - type: web
    name: kontrol-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: NODE_ENV
        value: production
      - key: COOKIE_CROSS_SITE
        value: 'true'
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # URL pública de esta misma API — la usa el login social (SSO) para armar el
      # redirect_uri que se registra en Google/Microsoft. Sin GOOGLE_CLIENT_ID/SECRET ni
      # MICROSOFT_CLIENT_ID/SECRET, los botones de SSO devuelven un error claro en vez de
      # romper el arranque (ver OidcSsoProvider).
      - key: API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Correo de aviso al recibir un comentario en "Soporte y comentarios". Sin
      # SMTP_HOST el comentario igual se guarda, solo no se envía el correo (ver
      # SmtpEmailNotifier). SMTP_USER/SMTP_PASS se completan a mano en el dashboard.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: 'Kontrol <kontrolcalidadasalas@gmail.com>'
      - key: SUPPORT_EMAIL_TO
        value: kontrolcalidadasalas@gmail.com

  - type: web
    name: kontrol-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kontrol-landing
    runtime: static
    staticPublishPath: landing
